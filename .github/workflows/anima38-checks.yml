name: Anima 3.8B adapter checks
on: [push, pull_request, workflow_dispatch]
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: training-ui/package-lock.json
      - run: python tools/setup_anima38.py --backend-only
      - run: python -m py_compile anima38_config.py anima38_ui_launcher.py tools/setup_anima38.py
      - run: python -m unittest discover -s tests
      - run: npm ci
        working-directory: training-ui
      - run: npm test
        working-directory: training-ui
